pm path=bin/pm.elf caps=spawn
vga_driver caps=mem:0xA0000+0x20000
console path=bin/console.elf caps=io:0x3F8+8 restart=3 ipc=vga_driver
ata path=bin/ata.elf caps=io:0x1F0+8,io:0x3F6+1 restart=3 ipc=console
rtc path=bin/rtc.elf caps=io:0x70+2 restart=3 ipc=console
fat path=bin/fat.elf arg=2 restart=3 ipc=ata,rtc,console
vfs path=bin/vfs.elf restart=3 ipc=ramfs,fat,ext,console
kbd path=bin/kbd.elf caps=io:0x60+1,irq:1 restart=3 ipc=console
ext path=bin/ext.elf arg=3 restart=3 ipc=ata,rtc,console
sh path=bin/sh.elf parent=init ipc=console,vfs,pm
init path=bin/init.elf restart=3 ipc=pm,vfs,console
pipe path=bin/pipe.elf restart=3 ipc=console
