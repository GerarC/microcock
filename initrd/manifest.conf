ext path=servers/ext arg=3 restart=3 ipc=ata,rtc,console
sh path=bin/sh parent=init ipc=console,tty,vfs,pm
sh2 path=bin/sh parent=init ipc=console,tty,vfs,pm
sh3 path=bin/sh parent=init ipc=console,tty,vfs,pm
sh4 path=bin/sh parent=init ipc=console,tty,vfs,pm
init path=servers/init restart=3 ipc=pm,vfs,console
